# ===================================================================
# 音频参数
# ===================================================================
audio:
  sample_rate: 16000        # 16kHz（ASR 行业标准）
  channels: 1              # 单声道
  dtype: int16             # 16-bit PCM
  block_size: 320          # 20ms per block (16000 * 0.02 = 320)
  mic_rms_threshold: 100   # 拿起话筒能量阈值（int16 RMS）
                            # 越小越敏感，建议 80-300

# ===================================================================
# VAD（仅方案 C 用）
# ===================================================================
vad:
  enabled: true
  model: silero_v5
  speech_threshold: 0.5    # 0.3-0.7，越大越严格
  min_silence_ms: 500      # 一句话结束的静音时长
  hangup_silence_sec: 5    # 通话结束的静音时长

# ===================================================================
# ASR（火山引擎）
# ===================================================================
asr:
  provider: volc
  language: zh-CN
  cluster: volcano_tts
  domain: bigmodel         # bigmodel / general
  format: pcm              # raw PCM

# ===================================================================
# TTS（火山引擎，豆包通用女声）
# ===================================================================
tts:
  provider: volc
  voice: BV001_streaming    # 豆包通用女声
  encoding: pcm_s16le      # 直接 PCM，无需转码
  sample_rate: 16000

# ===================================================================
# 豆包秘书
# ===================================================================
doubao:
  model: doubao-pro
  temperature: 0.7
  max_history: 20          # 对话历史最大条数（user + assistant pair）

# ===================================================================
# 4 部委模型映射
# ===================================================================
departments:
  organization: claude-opus-4-20250514
  propaganda: gemini-2.5-pro
  social: gpt-5-codex
  politics_law: deepseek-reasoner

# ===================================================================
# 日志
# ===================================================================
logging:
  level: INFO
  file: logs/gaoyuliang.log
  max_bytes: 10485760      # 10MB
  backup_count: 5